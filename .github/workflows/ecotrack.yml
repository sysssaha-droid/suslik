name: EcoTrack CI/CD

# The workflow lives at the repository root because GitHub only executes
# workflows from .github/workflows/. It is scoped to the student project via
# path filters.
on:
  push:
    branches: [main]
    paths:
      - "students/suslik/**"
      - ".github/workflows/ecotrack.yml"
  pull_request:
    branches: [main]
    paths:
      - "students/suslik/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecotrack-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIR: students/suslik
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/ecotrack
  TF_VERSION: "1.10.5"
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  # -------------------------------------------------------------------------
  # 1. Tests: fast feedback on every pull request and push.
  # -------------------------------------------------------------------------
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: students/suslik/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: students/suslik/src/requirements*.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  # -------------------------------------------------------------------------
  # 2. Build and push the image to Docker Hub (main branch only).
  # -------------------------------------------------------------------------
  build:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: students/suslik
          file: students/suslik/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=EcoTrack API
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 3. Create/update the AWS infrastructure with Terraform.
  #    State is stored in S3 so repeated runs reuse the same instance.
  # -------------------------------------------------------------------------
  terraform:
    name: Terraform apply
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: students/suslik/infra
    outputs:
      public_ip: ${{ steps.outputs.outputs.public_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Prepare SSH keys
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          umask 077
          echo "$EC2_SSH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"
          ssh-keygen -y -f "$RUNNER_TEMP/ec2_key" > "$RUNNER_TEMP/ec2_key.pub"

      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=students/suslik/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply
        env:
          SSH_CIDR: ${{ vars.SSH_CIDR || '0.0.0.0/0' }}
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_region=$AWS_REGION" \
            -var="ssh_public_key=$(cat "$RUNNER_TEMP/ec2_key.pub")" \
            -var="ssh_cidr=$SSH_CIDR"

      - name: Read Terraform outputs
        id: outputs
        run: echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 4. Deploy: pull the freshly built image and restart the container on EC2.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: [build, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          umask 077
          echo "$EC2_SSH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"

      - name: Wait for cloud-init
        env:
          HOST: ${{ needs.terraform.outputs.public_ip }}
        run: |
          for attempt in $(seq 1 30); do
            if ssh -i "$RUNNER_TEMP/ec2_key" \
                 -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=5 \
                 "ec2-user@$HOST" 'docker info' >/dev/null 2>&1; then
              echo "Docker is ready on $HOST (attempt $attempt)."
              exit 0
            fi
            echo "Waiting for Docker on $HOST (attempt $attempt/30)..."
            sleep 10
          done
          echo "::error::The instance did not become ready in time."
          exit 1

      - name: Pull image and restart container
        env:
          HOST: ${{ needs.terraform.outputs.public_ip }}
          TAG: sha-${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          ssh -i "$RUNNER_TEMP/ec2_key" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "ec2-user@$HOST" 'bash -s' <<EOF
          set -euo pipefail
          echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
          docker pull "$IMAGE:$TAG"
          docker rm -f ecotrack >/dev/null 2>&1 || true
          docker run -d \
            --name ecotrack \
            --restart unless-stopped \
            -p 8000:8000 \
            -e APP_ENV=production \
            -e SEED_DEMO=true \
            -v ecotrack-data:/data \
            "$IMAGE:$TAG"
          docker image prune -f >/dev/null
          EOF

      - name: Smoke test
        env:
          APP_URL: http://${{ needs.terraform.outputs.public_ip }}:8000
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "$APP_URL/health" | grep -q '"status":"ok"'; then
              echo "Health check passed: $APP_URL/health"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed."
          curl --verbose "$APP_URL/health" || true
          exit 1
